<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,family=Poppins" rel="stylesheet">

    <link rel="stylesheet" href="Cart.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo"><a href="E-Commerce.html"><img src="assets/Croma logo/logo.png" alt=""></a></div>
        <div class="nav-links">
            <div class="menu">
                <span class="material-symbols-outlined">menu</span>
                <span class="menu-text">Menu</span>
            </div>
            <div class="search-box">
                <input type="text" placeholder="What are you looking for ?">
                <span class="material-symbols-outlined" style="font-size: 18px;">search</span>
            </div>
            <div class="location">
                <span class="material-symbols-outlined">location_on</span>
                <span>Jharkhand,828106</span>
                <span class="material-symbols-outlined edit">edit</span>
            </div>
            <a href="products.html">
                <div class="products">
                    <span>Products</span>
                    <span class="material-symbols-outlined">shopping_bag</span>
                </div>
            </a>
            <a href="login.html" class="material-symbols-outlined profile">person</a>
            <span class="material-symbols-outlined cart">shopping_cart</span>
        </div>
    </nav>
    <h3 style="font-weight: 700; padding-bottom: 30px; margin-left: 200px; font-size: 20px;">Your Cart</h3>
    <div class="cart-box">
        <div>
            <button class="apply-coupon">
                <div class="coupon-text"><span class="material-symbols-outlined"
                        style="cursor: pointer;">local_activity</span>
                    <span style="font-size: 20px;  font-weight: 700;">Apply Coupon</span>
                </div>
                <span class="material-symbols-outlined" style="cursor: pointer;">keyboard_arrow_right</span>
            </button>
            <div class="cart-container">
                <div class="cart-column1" style="padding: 20px 0px;">
                    <div style="width: 100%; height: 110px;"><a href=""><img src="Products/Mobiles/307504_0_ivzvgp.webp"
                                alt=""></a></div>
                </div>
                <div class="cart-column2" style="padding: 20px 0px; font-size: medium;">
                    OnePlus Nord CE4 5G (8GB RAM, 256GB, Chrome)
                    <div style="color: rgb(132, 126, 126);">★★★★☆</div>
                    <div style="font-size: small;">Standard Delivery by 30 July 2025.</div>
                    <div style="font-size: small;">Delivery Free.</div>
                    <div>
                        <span><button class="cart-button">Add to Wishlist</button></span>
                        <span ><button class="cart-button">Remove</button></span>
                    </div>
                </div>
                <div class="cart-column3" style="padding: 28px 0px;"></div>
            </div>
        </div>
        <div class="checkout-container">
            <div style="font-weight: 600 ; margin-left: 10px; margin-top: 10px;"><span> Order Summary ( 1 item )</span>
            </div>
            <div class="order-summary">
                <div style="margin: 10px 10px; gap: 20px;"><span>Original Price</span> <span>₹24,999.00</span></div>
                <div style="margin: 10px 10px;"><Span>Total</Span> <span>₹24,999.00</span></div>
                <div>
                    <button class="checkout-button" style="margin-left: 20px; margin-top: 10px;">Checkout</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
